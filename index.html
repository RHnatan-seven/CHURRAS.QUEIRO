<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Churras.Queiro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
<div class="overlay">
<h1>CHURRAS.<span>QUEIRO</span></h1>
<p>Calculadora realista para seu churrasco</p>
</div>
</header>

<main class="container">
<section class="panel">
<h2>Pessoas</h2>
<div class="row">
<button id="minus">-</button>
<span id="people">10</span>
<button id="plus">+</button>
</div>

<h2>Duração</h2>
<div class="row">
<button class="dur active" data-h="2">2h</button>
<button class="dur" data-h="4">4h</button>
<button class="dur" data-h="6">6h+</button>
</div>

<button id="calc">Calcular Churrasco</button>
</section>

<section class="panel">
<h2>Lista de Compras</h2>
<div id="lista"></div>
<h3>Total Estimado: <span id="total"></span></h3>
<button id="copy">Copiar Lista</button>
<button onclick="window.print()">Exportar PDF</button>
</section>
</main>

<script src="script.js"></script>
</body>
</html>
